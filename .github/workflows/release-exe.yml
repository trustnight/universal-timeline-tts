name: Build and Release EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare AutoHotkey v2 + Ahk2Exe
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = "$env:RUNNER_TEMP\ahk"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          # 从 GitHub Releases 下载 AutoHotkey v2 便携版（包含 Compiler\Ahk2Exe.exe）
          $version = '2.0.18'
          $ahkZip = "$dest\AutoHotkey_$version.zip"
          curl -fsSL -A "curl/8.x" -o "$ahkZip" "https://github.com/AutoHotkey/AutoHotkey/releases/download/v$version/AutoHotkey_$version.zip"
          Expand-Archive -LiteralPath $ahkZip -DestinationPath $dest -Force

          # 在解压的 AutoHotkey 中查找 Ahk2Exe（位于 Compiler\Ahk2Exe.exe）
          $compilerDir = Get-ChildItem -Path $dest -Recurse -Directory -Filter "Compiler" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $compilerDir) { throw "Compiler directory not found in AutoHotkey portable." }

          # 定位工具路径
          $global:AHK_BASE = Get-ChildItem -Path $dest -Recurse -Filter "AutoHotkey64.exe" | Select-Object -First 1 -ExpandProperty FullName
          $global:AHK2EXE  = Get-ChildItem -Path $compilerDir -Recurse -Filter "Ahk2Exe.exe" | Select-Object -First 1 -ExpandProperty FullName
          if (!$AHK_BASE -or !$AHK2EXE) { throw "Required tools not found." }

          # 创建输出目录并编译
          New-Item -ItemType Directory -Force -Path "$PWD\dist" | Out-Null
          & $AHK2EXE /in "$PWD\main.ahk" /out "$PWD\dist\DBM.exe" /base "$AHK_BASE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/DBM.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: exe
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DBM.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}