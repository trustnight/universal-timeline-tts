name: Build and Release EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare AutoHotkey v2 + Ahk2Exe
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = "$env:RUNNER_TEMP\ahk"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          # 从 GitHub Releases 下载 AutoHotkey v2 便携版（包含 Compiler\Ahk2Exe.exe）
          $version = '2.0.18'
          $ahkZip = "$dest\AutoHotkey_$version.zip"
          curl -fsSL -A "curl/8.x" -o "$ahkZip" "https://github.com/AutoHotkey/AutoHotkey/releases/download/v$version/AutoHotkey_$version.zip"
          Expand-Archive -LiteralPath $ahkZip -DestinationPath $dest -Force

          # 下载 Ahk2Exe（通过 GitHub API 动态获取 zip 资产）
          $repo = 'AutoHotkey/Ahk2Exe'
          $headers = @{ 'User-Agent' = 'github-actions'; 'Accept' = 'application/vnd.github+json' }
          if ($env:GITHUB_TOKEN) { $headers['Authorization'] = "token $env:GITHUB_TOKEN" }
          $downloadUrl = $null
          try {
            $releases = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases"
            $asset = $releases | ForEach-Object { $_.assets } | Where-Object { $_.name -match 'Ahk2Exe.*\.zip$' } | Select-Object -First 1
            if ($asset) { $downloadUrl = $asset.browser_download_url }
          } catch {}
          if (-not $downloadUrl) {
            # 兜底到 latest 下载地址（可能被重定向）
            $downloadUrl = 'https://github.com/AutoHotkey/Ahk2Exe/releases/latest/download/Ahk2Exe.zip'
          }
          $ahk2exeZip = "$dest\Ahk2Exe.zip"
          Write-Host "Downloading Ahk2Exe from $downloadUrl"
          $maxAttempts = 3
          for ($i=1; $i -le $maxAttempts; $i++) {
            try {
              curl -fsSL -L -A "curl/8.x" -o "$ahk2exeZip" "$downloadUrl"
              if (Test-Path $ahk2exeZip) { break }
            } catch {
              if ($i -eq $maxAttempts) { throw }
              Start-Sleep -Seconds (2 * $i)
            }
          }
          if (!(Test-Path $ahk2exeZip)) { throw "Ahk2Exe.zip download failed." }
          Expand-Archive -LiteralPath $ahk2exeZip -DestinationPath "$dest\Ahk2Exe" -Force

          # 定位工具路径
          # 优先选择 v2 目录下的 AutoHotkey64.exe，否则退回第一项
          $ahk64All = Get-ChildItem -Path $dest -Recurse -Filter "AutoHotkey64.exe"
          $global:AHK_BASE = ($ahk64All | Where-Object { $_.FullName -match "\\v2\\" } | Select-Object -First 1 -ExpandProperty FullName)
          if (-not $global:AHK_BASE) { $global:AHK_BASE = ($ahk64All | Select-Object -First 1 -ExpandProperty FullName) }

          # 在 Ahk2Exe 解压目录中查找 Ahk2Exe.exe
          $global:AHK2EXE  = Get-ChildItem -Path "$dest\Ahk2Exe" -Recurse -Filter "Ahk2Exe.exe" | Select-Object -First 1 -ExpandProperty FullName
          if (!$AHK_BASE -or !$AHK2EXE) { throw "Required tools not found." }

          # 创建输出目录并编译
          New-Item -ItemType Directory -Force -Path "$PWD\dist" | Out-Null
          & $AHK2EXE /in "$PWD\main.ahk" /out "$PWD\dist\DBM.exe" /base "$AHK_BASE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/DBM.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: exe
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DBM.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}